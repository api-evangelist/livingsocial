name: LivingSocial
description: 'LivingSocial is a consumer daily-deals and local-experiences marketplace
  that sells discounted vouchers and offers across travel, events, dining, activities,
  and products, alongside a coupon and promo-code section for major retailers. Originally
  a pioneering group-buying company, its brand and marketplace now operate as an
  affiliate deals and coupons destination. It was surfaced as a portfolio company of
  Insight Partners and added to the API Evangelist network. As of this enrichment pass
  the public site (livingsocial.com) exposes no developer program, API, or documentation
  surface: probes of common developer subdomains (developer/api/docs) and /.well-known/
  discovery endpoints returned redirects to the consumer site or 404s.'
